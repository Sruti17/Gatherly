spring.application.name=gatherly


# ============================================================
# SERVER
# ============================================================

# Local:
# 8081
#
# Render:
# automatically supplies PORT
server.port=${PORT:8081}


# ============================================================
# DATABASE
# ============================================================

# Local defaults to your existing H2 DB.
#
# Production will supply:
#
# DB_URL
# DB_USERNAME
# DB_PASSWORD
# DB_DRIVER

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/gatherly;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}

spring.datasource.username=${DB_USERNAME:sa}

spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}


# Let Hibernate create/update the required tables.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.open-in-view=false


# Keep connection usage small for a free database.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000


# ============================================================
# EVENTBRITE
# ============================================================

eventbrite.access-token=${EVENTBRITE_ACCESS_TOKEN:}

eventbrite.api-url=${EVENTBRITE_API_URL:https://www.eventbriteapi.com/v3/events/search/}


# ============================================================
# GOOGLE AUTH
# ============================================================

google.oauth.client-id=${GOOGLE_CLIENT_ID:}


# ============================================================
# FRONTEND / CORS
# ============================================================

app.frontend-url=${FRONTEND_URL:http://localhost:5174}